# nginx trong image frontend (docker compose):
#   /            giao diện React đã build; đường dẫn lạ trả index.html để React Router xử lý
#   /api/, /admin/  chuyển tới backend (gunicorn)
#   /media/      ảnh tải lên và ảnh kết quả, đọc thẳng từ volume media
#   /static/     file tĩnh của trang /admin/, đọc từ volume static
server {
    listen 80;

    # Ảnh tải lên tối đa 10 MB (MAX_UPLOAD_MB ở backend) cộng phần đầu multipart
    client_max_body_size 12m;
    # Vượt mức trên thì nginx chặn trước khi tới backend: trả JSON thay cho trang HTML 413 mặc định
    error_page 413 @too_large;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        # Giữ nguyên host:cổng để backend tạo đúng URL ảnh và qua được kiểm tra CSRF của /admin/
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/diagnoses/ chạy pipeline ngay trong request
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /srv/media/;
    }

    location /static/ {
        alias /srv/static/;
    }

    location / {
        try_files $uri /index.html;
    }

    # "detail" để errorMessage() ở frontend hiện được (lỗi không phải 400 thì đọc detail);
    # "image" cùng dạng lỗi validation của POST /api/diagnoses/. Câu chữ trùng serializers.py.
    location @too_large {
        default_type application/json;
        return 413 '{"detail": "Ảnh vượt quá 10 MB.", "image": ["Ảnh vượt quá 10 MB."]}';
    }
}
