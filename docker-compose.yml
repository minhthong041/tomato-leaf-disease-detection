# Chạy toàn bộ hệ thống bằng một lệnh (từ thư mục gốc repo):
#     docker compose up
# rồi mở http://localhost:8080 (đổi cổng bằng WEB_PORT trong .env).
#
# Biến môi trường đọc từ file .env ở thư mục gốc (mẫu: .env.example). Không có .env thì dùng giá trị
# mặc định bên dưới: đủ để chạy thử trên máy, KHÔNG dùng khi đưa lên server thật.
#
# 3 dịch vụ:
#   db        PostgreSQL, dữ liệu lưu ở volume postgres-data
#   backend   Django + gunicorn; khi khởi động tự chạy migrate (xem backend/Dockerfile)
#   frontend  nginx phục vụ giao diện React đã build, chuyển /api, /admin tới backend,
#             trả thẳng ảnh trong /media và file tĩnh /static
name: tomato-leaf-disease

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-tomato_leaf_disease_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_NAME: ${DB_NAME:-tomato_leaf_disease_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: '5432'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-chi-de-chay-thu-tren-may-hay-doi-trong-env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      TERMS_VERSION: ${TERMS_VERSION:-1.0}
      # Có DJANGO_SUPERUSER_EMAIL thì tự tạo tài khoản quản trị lúc khởi động (bỏ qua nếu đã có)
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_FULLNAME: ${DJANGO_SUPERUSER_FULLNAME:-Quản trị viên}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  media:
  static:
